{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubepyramid.dbSecretName" . }}
  labels:
    {{- include "kubepyramid.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Full connection string consumed by the collector + engine as KUBEPYRAMID_DB_DSN.
  dsn: {{ include "kubepyramid.dbDsn" . | quote }}
{{- end }}
