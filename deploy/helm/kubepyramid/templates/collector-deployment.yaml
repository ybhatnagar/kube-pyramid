{{- if .Values.collector.service.enabled }}
# Long-running collector trigger service (POST /ingest) for on-demand collection.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubepyramid.fullname" . }}-collector-svc
  labels:
    {{- include "kubepyramid.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubepyramid.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector-svc
  template:
    metadata:
      labels:
        {{- include "kubepyramid.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector-svc
    spec:
      serviceAccountName: {{ include "kubepyramid.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 65532
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          image: "{{ .Values.images.collector.repository }}:{{ .Values.images.collector.tag }}"
          imagePullPolicy: {{ .Values.images.collector.pullPolicy }}
          args:
            - serve
            - --addr
            - ":{{ .Values.collector.service.port }}"
            - --prom-url
            - {{ .Values.collector.promUrl | quote }}
            - --interaction-source
            - {{ .Values.collector.interactionSource | quote }}
            - --cluster
            - {{ .Values.collector.cluster | quote }}
          env:
            {{- include "kubepyramid.dbEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.collector.service.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            {{- include "kubepyramid.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.collector.serviceResources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubepyramid.fullname" . }}-collector-svc
  labels:
    {{- include "kubepyramid.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector-svc
spec:
  selector:
    {{- include "kubepyramid.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collector-svc
  ports:
    - name: http
      port: {{ .Values.collector.service.port }}
      targetPort: http
{{- end }}
